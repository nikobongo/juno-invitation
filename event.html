<!-- Drag the bottom rod down to open the scroll -->
<section class="scroll" id="scroll">
    <div class="rod"></div>

    <div class="paper" id="paper">
        <div class="paper-inner" id="paperInner">
            <h2 class="details-title">What's Happening in Ponyville</h2>
            <p class="event-date">November <span class="day">28</span> 2026</p>
            <p class="event-day">Saturday</p>

            <div class="events">
                <div class="christening">
                    <img class="christening-icon" src="image/house1.png" alt="Church icon">

                    <div class="christening-text">
                        <div class="christening-line">
                            <p class="christening-title">Christening</p>
                            <p class="christening-time">8:00 AM</p>
                        </div>
                        <p class="christening-venue">Sto Nino de Molino Parish Church</p>
                        <a class="location-btn"
                           href="https://maps.app.goo.gl/kX8roSxvVZmmEc4s9"
                           target="_blank"
                           rel="noopener noreferrer">View Location</a>
                    </div>
                </div>

                <div class="party">
                    <img class="christening-icon" src="image/house2.png" alt="Party venue icon">

                    <div class="christening-text">
                        <div class="christening-line">
                            <p class="christening-title">Party</p>
                            <p class="christening-time">12:00 NN</p>
                        </div>
                        <p class="christening-venue">McDonald's Buhay na Tubig</p>
                        <a class="location-btn"
                           href="https://maps.app.goo.gl/1XxNWtvkAEZiDQcUA"
                           target="_blank"
                           rel="noopener noreferrer">View Location</a>
                    </div>
                </div>
            </div>

            <!-- Countdown to November 28, 2026 -->
            <div class="countdown">
                <p class="countdown-label">Everypony’s counting down to the big day!</p>
                <div class="countdown-units">
                    <div class="countdown-unit">
                        <span class="countdown-value" id="cd-days">00</span>
                        <span class="countdown-unit-label">Days</span>
                    </div>
                    <div class="countdown-unit">
                        <span class="countdown-value" id="cd-hours">00</span>
                        <span class="countdown-unit-label">Hours</span>
                    </div>
                    <div class="countdown-unit">
                        <span class="countdown-value" id="cd-minutes">00</span>
                        <span class="countdown-unit-label">Minutes</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="rod handle" id="handle"
         role="slider" tabindex="0"
         aria-label="Drag down to open the scroll"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="arrow"></span>
    </div>
</section>
