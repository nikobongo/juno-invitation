<!-- Dress Code -->
<section class="dress-code">
    <h2 class="dress-code-title">Your Mane Attire Choices!</h2>
    <p class="dress-code-subtitle">DRESS CODE NOTE:</p>
    <p class="dress-code-subtitle">GUESTS are requested to avoid white and purple.</p>
    <p class="dress-code-subtitle">GODPARENTS are encouraged to wear white.</p>

    <div class="dress-slider">
        <div class="dress-slider-viewport">
            <div class="dress-slider-track" id="dressTrack">
                <div class="dress-slide">
                    <img src="../../media/image/dress/applejackpalette.png" alt="Applejack's color palette">
                </div>
                <div class="dress-slide">
                    <img src="../../media/image/dress/rainbowdashpalette.png" alt="Rainbow Dash's color palette">
                </div>
                <div class="dress-slide">
                    <img src="../../media/image/dress/fluttershypalette.png" alt="Fluttershy's color palette">
                </div>
                <div class="dress-slide">
                    <img src="../../media/image/dress/pinkiepiepalette.png" alt="Pinkie Pie's color palette">
                </div>
            </div>
        </div>

        <div class="dress-slider-dots">
            <span class="dress-dot is-active" data-index="0" aria-label="Applejack"></span>
            <span class="dress-dot" data-index="1" aria-label="Rainbow Dash"></span>
            <span class="dress-dot" data-index="2" aria-label="Fluttershy"></span>
            <span class="dress-dot" data-index="3" aria-label="Pinkie Pie"></span>
        </div>
    </div>
</section>
